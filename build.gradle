plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }
version = "${versionProps.version}-b${versionProps.build_number}-neoforge-1.21.1-unofficial"
group = 'com.igteam.immersivegeology'
base.archivesName = 'ImmersiveGeology'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main.resources.srcDir 'src/generated/resources'
    datagen {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

neoForge {
    version = version_neoforge
    addModdingDependenciesTo sourceSets.datagen
    addModdingDependenciesTo sourceSets.gametest
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            sourceSet = sourceSets.datagen
            programArguments.addAll '--mod', 'immersivegeology', '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'immersivegeology'
        }
    }
    mods {
        immersivegeology {
            sourceSet sourceSets.main
            sourceSet sourceSets.datagen
            sourceSet sourceSets.gametest
        }
    }
}

repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'blusunrize.immersiveengineering'; includeGroup 'mezz.jei'; includeGroup 'malte0811' }
    }
    mavenCentral()
}

dependencies {
    implementation "blusunrize.immersiveengineering:ImmersiveEngineering:${version_ie}"
    compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${version_ie}:datagen"
    compileOnly 'malte0811:DualCodecs:0.1.2'
    datagenImplementation "blusunrize.immersiveengineering:ImmersiveEngineering:${version_ie}:datagen"
    compileOnly "mezz.jei:jei-1.21.1-common-api:${version_jei}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${version_jei}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${version_jei}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    def replacements = [version: project.version, mc_version: version_minecraft,
                        neo_version: version_neoforge, jei_version: version_jei, version_ie: version_ie]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') { expand replacements }
    exclude '.cache'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.withType(Jar).configureEach { zip64 = true }
tasks.named('test') { useJUnitPlatform() }

tasks.register('datagenJar', Jar) {
    dependsOn tasks.named('datagenClasses')
    archiveClassifier = 'datagen'
    from sourceSets.datagen.output
    manifest { attributes 'FMLModType': 'GAMELIBRARY' }
}

tasks.register('sourcesJar', Jar) {
    dependsOn tasks.classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource, sourceSets.datagen.allSource
}

artifacts {
    archives tasks.named('sourcesJar')
    archives tasks.named('datagenJar')
}

def customGradle = rootProject.file('custom.gradle')
if (customGradle.exists()) apply from: customGradle
